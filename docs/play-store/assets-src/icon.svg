<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="18 18 72 72">
  <!--
    Google Play icon: the adaptive launcher icon flattened to a square.
    Background = @color/ic_launcher_background; the paths are copied from
    mobile/android/app/src/main/res/drawable/ic_launcher_foreground.xml.
    A launcher shows the central 72 of the 108 units, hence the viewBox.
  -->
  <rect width="108" height="108" fill="#FF5A1F" />
  <path
    fill="#121212"
    d="M46,37 h20 a9,9 0 0 1 9,9 v20 a9,9 0 0 1 -9,9 h-20 a9,9 0 0 1 -9,-9 v-20 a9,9 0 0 1 9,-9 z" />
  <path
    fill="#FFFCF6"
    stroke="#121212"
    stroke-width="3.5"
    d="M42,33 h20 a9,9 0 0 1 9,9 v20 a9,9 0 0 1 -9,9 h-20 a9,9 0 0 1 -9,-9 v-20 a9,9 0 0 1 9,-9 z" />
  <path
    fill="none"
    stroke="#121212"
    stroke-width="6"
    stroke-linecap="round"
    stroke-linejoin="round"
    d="M42.5,52.5 L49.5,59 L62,45" />
  <path
    fill="#D7F75B"
    stroke="#121212"
    stroke-width="3"
    d="M65,33.5 a5.5,5.5 0 1 0 11,0 a5.5,5.5 0 1 0 -11,0 z" />
</svg>
