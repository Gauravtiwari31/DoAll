# Builds DoAll for Android.
#  - Every push that touches the app, or a manual run: a release APK is attached
#    to the run as the "DoAll-apk" artifact. Once the upload key secrets exist,
#    the Play-ready app bundle is attached too ("DoAll-aab").
#  - Pushing a version tag (e.g. v1.2.0), or a manual run with "release" set:
#    the APK and the bundle are also published on a GitHub Release. Needs the
#    upload key, and the tag must match the version in mobile/package.json.
#  - A manual run with "play_track" set also uploads the bundle to Google Play
#    as a draft release on that track. Needs PLAY_SERVICE_ACCOUNT_JSON.
# Setup and secrets: docs/play-store/README.md
name: Android build

on:
  workflow_dispatch:
    inputs:
      release:
        description: 'Publish a GitHub release with this tag (e.g. v1.2.0); leave empty for a test build'
        required: false
        default: ''
      play_track:
        description: 'Also upload the app bundle to Google Play as a draft on this track'
        type: choice
        options: [none, internal, alpha, beta, production]
        default: none
  push:
    branches: ['**']
    tags: ['v*']
    paths:
      - 'mobile/**'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: write # needed only to publish the release

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    name: Build APK and app bundle
    runs-on: ubuntu-latest
    timeout-minutes: 75
    defaults:
      run:
        working-directory: mobile
    env:
      # Secrets can't be tested in `if:` conditions; these flags can.
      HAS_UPLOAD_KEY: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 != '' && secrets.ANDROID_UPLOAD_STORE_PASSWORD != '' && secrets.ANDROID_UPLOAD_KEY_ALIAS != '' && secrets.ANDROID_UPLOAD_KEY_PASSWORD != '' }}
      HAS_PLAY_ACCOUNT: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON != '' }}
      IS_RELEASE: ${{ startsWith(github.ref, 'refs/tags/v') || inputs.release != '' }}
      RELEASE_TAG: ${{ inputs.release || github.ref_name }}
      PLAY_TRACK: ${{ inputs.play_track || 'none' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Check release requirements
        env:
          GOOGLE_WEB_CLIENT_ID: ${{ vars.DOALL_GOOGLE_WEB_CLIENT_ID }}
        run: |
          version=$(node -p "require('./package.json').version")
          echo "App version $version"
          if [ "$IS_RELEASE" = "true" ] && [ "${RELEASE_TAG#v}" != "$version" ]; then
            echo "::error::Release $RELEASE_TAG doesn't match version $version in mobile/package.json. Bump the version there first."
            exit 1
          fi
          if { [ "$IS_RELEASE" = "true" ] || [ "$PLAY_TRACK" != "none" ]; } && [ "$HAS_UPLOAD_KEY" != "true" ]; then
            echo "::error::Releases must be signed with the upload key, but the ANDROID_UPLOAD_* secrets are missing. In mobile/, run: npm run play:upload-key -- --github (see docs/play-store/README.md)."
            exit 1
          fi
          if [ "$PLAY_TRACK" != "none" ] && [ "$HAS_PLAY_ACCOUNT" != "true" ]; then
            echo "::error::Uploading to Google Play needs the PLAY_SERVICE_ACCOUNT_JSON secret (see docs/play-store/README.md)."
            exit 1
          fi
          if [ "$HAS_UPLOAD_KEY" != "true" ]; then
            echo "::notice::No upload key secrets yet: building a test APK signed with the debug key, and no app bundle."
          fi
          if [ -z "$GOOGLE_WEB_CLIENT_ID" ]; then
            echo "::notice::The DOALL_GOOGLE_WEB_CLIENT_ID variable isn't set, so this build has no Continue with Google (see docs/google-sign-in.md)."
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        run: npm ci

      # Repository variables (Settings → Secrets and variables → Actions →
      # Variables) baked into src/env.ts. Neither is a secret:
      #  - DOALL_API_URL, e.g. https://doall-api.onrender.com, makes the app use
      #    the hosted backend by default. Unset = local backend (10.0.2.2).
      #  - DOALL_GOOGLE_WEB_CLIENT_ID, the server's Google OAuth client ID,
      #    turns on "Continue with Google" (docs/google-sign-in.md).
      #  - DOALL_SENTRY_DSN turns on crash reporting (docs/operations.md).
      - name: Write the build settings
        env:
          DOALL_API_URL: ${{ vars.DOALL_API_URL }}
          DOALL_GOOGLE_WEB_CLIENT_ID: ${{ vars.DOALL_GOOGLE_WEB_CLIENT_ID }}
          DOALL_SENTRY_DSN: ${{ vars.DOALL_SENTRY_DSN }}
        run: node scripts/write-build-env.mjs

      - name: Restore the upload key
        if: env.HAS_UPLOAD_KEY == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/doall-upload.jks"

      - name: Build
        working-directory: mobile/android
        env:
          # Read by app/build.gradle. Empty without the secrets: debug signing.
          DOALL_UPLOAD_STORE_FILE: ${{ env.HAS_UPLOAD_KEY == 'true' && format('{0}/doall-upload.jks', runner.temp) || '' }}
          DOALL_UPLOAD_STORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_STORE_PASSWORD }}
          DOALL_UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          DOALL_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
          # Optional: uploads the JavaScript source maps for readable crash
          # reports. Unset = no upload (see app/build.gradle).
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}
        # Phones (arm64 / armv7) and x86_64 emulators and Chromebooks.
        run: |
          tasks="assembleRelease"
          if [ "$HAS_UPLOAD_KEY" = "true" ]; then tasks="bundleRelease assembleRelease"; fi
          chmod +x gradlew
          ./gradlew $tasks --no-daemon \
            -PreactNativeArchitectures=arm64-v8a,armeabi-v7a,x86_64

      - name: Collect the outputs
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk DoAll.apk
          if [ "$HAS_UPLOAD_KEY" = "true" ]; then
            cp android/app/build/outputs/bundle/release/app-release.aab DoAll.aab
          fi
          apksigner="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -n 1)apksigner"
          {
            echo "### DoAll $(node -p "require('./package.json').version")"
            echo
            if [ "$HAS_UPLOAD_KEY" = "true" ]; then
              echo "Signed with the **upload key**: \`DoAll.aab\` is ready for Google Play."
            else
              echo "Signed with the **debug key** because the upload key secrets aren't set: for testing only, Google Play would reject it."
            fi
            echo
            echo '```'
            "$apksigner" verify --print-certs DoAll.apk | grep -E 'DN:|SHA-256' || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: DoAll-apk
          path: mobile/DoAll.apk
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: env.HAS_UPLOAD_KEY == 'true'
        with:
          name: DoAll-aab
          path: mobile/DoAll.aab
          if-no-files-found: error

      # R8 mapping, to read obfuscated stack traces from the GitHub APK. (Play
      # gets it inside the app bundle.)
      - uses: actions/upload-artifact@v4
        with:
          name: DoAll-mapping
          path: mobile/android/app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: warn

      - name: Publish on the release
        if: env.IS_RELEASE == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ github.sha }}
          name: DoAll ${{ env.RELEASE_TAG }}
          body_path: .github/RELEASE_NOTES.md
          files: |
            mobile/DoAll.apk
            mobile/DoAll.aab

      - name: Prepare the Google Play release notes
        if: env.PLAY_TRACK != 'none'
        run: |
          code=$(node -p "const [a, b, c] = require('./package.json').version.split('.').map(Number); a * 10000 + b * 100 + c")
          notes="fastlane/metadata/android/en-US/changelogs/$code.txt"
          if [ ! -f "$notes" ]; then
            echo "::error::Write the release notes for version code $code in mobile/$notes first."
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/whatsnew"
          cp "$notes" "$RUNNER_TEMP/whatsnew/whatsnew-en-US"

      # Created as a draft: review and roll it out in Play Console.
      - name: Upload to Google Play
        if: env.PLAY_TRACK != 'none'
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: io.github.gauravtiwari31.doall
          releaseFiles: mobile/DoAll.aab
          track: ${{ env.PLAY_TRACK }}
          status: draft
          whatsNewDirectory: ${{ runner.temp }}/whatsnew
