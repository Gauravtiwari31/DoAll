# Builds an installable DoAll APK.
#  - Every push that touches the app, or a manual run: APK is attached to the
#    workflow run as the "DoAll-apk" artifact.
#  - Pushing a version tag (e.g. v1.0.0), or running the workflow manually
#    with a "release" version: the APK is also published on a GitHub Release
#    (the tag is created on the built commit if it doesn't exist yet).
name: Android APK

on:
  workflow_dispatch:
    inputs:
      release:
        description: 'Publish a release with this tag (e.g. v1.0.0); leave empty for a test build'
        required: false
        default: ''
  push:
    branches: ['**']
    tags: ['v*']
    paths:
      - 'mobile/**'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: write # needed only to publish the APK on a Release

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        run: npm ci

      # Repository variable DOALL_API_URL (Settings → Secrets and variables →
      # Actions → Variables), e.g. https://doall-api.onrender.com, makes the APK
      # use the hosted backend by default. Unset = local backend (10.0.2.2).
      - name: Point the app at the hosted API
        if: vars.DOALL_API_URL != ''
        env:
          DOALL_API_URL: ${{ vars.DOALL_API_URL }}
        run: |
          node -e "require('fs').writeFileSync('src/env.ts', 'export const HOSTED_API_URL: string | null = ' + JSON.stringify(process.env.DOALL_API_URL) + ';\n')"
          cat src/env.ts

      - name: Build release APK
        working-directory: mobile/android
        # Phones (arm64 / armv7) and x86_64 emulators; skips 32-bit x86 to save time.
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon \
            -PreactNativeArchitectures=arm64-v8a,armeabi-v7a,x86_64

      - name: Rename APK
        run: cp android/app/build/outputs/apk/release/app-release.apk DoAll.apk

      - uses: actions/upload-artifact@v4
        with:
          name: DoAll-apk
          path: mobile/DoAll.apk
          if-no-files-found: error

      - name: Publish on the release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release || github.ref_name }}
          target_commitish: ${{ github.sha }}
          name: DoAll ${{ inputs.release || github.ref_name }}
          body_path: .github/RELEASE_NOTES.md
          files: mobile/DoAll.apk
