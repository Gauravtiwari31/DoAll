# Weekly dependency updates as pull requests; CI tests each one.
version: 2
updates:
  - package-ecosystem: npm
    directory: /backend
    schedule:
      interval: weekly
    groups:
      # One pull request for all minor and patch updates, not one each.
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: npm
    directory: /mobile
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # React Native and its matching packages move together, by hand.
      - dependency-name: 'react-native'
      - dependency-name: 'react'
      - dependency-name: '@react-native/*'
      - dependency-name: '@react-native-community/cli*'
      - dependency-name: 'react-test-renderer'
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
