# Render Blueprint for the DoAll API (free plan).
# Render dashboard → New → Blueprint → pick this repo. You'll be asked for
# MONGODB_URI (your MongoDB Atlas connection string); the JWT secrets are
# generated automatically.
services:
  - type: web
    name: doall-api
    runtime: node
    plan: free
    region: singapore
    rootDir: backend
    buildCommand: npm ci && npm run build
    startCommand: npm run start:prod
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: '22'
      - key: MONGODB_URI
        sync: false
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_ACCESS_TTL
        value: 15m
      - key: JWT_REFRESH_TTL
        value: 30d
      # Render sits one proxy hop in front of the app.
      - key: TRUST_PROXY
        value: '1'
      # Sign in with Google (optional): the Web OAuth client's ID and secret,
      # entered in the dashboard. See docs/google-sign-in.md.
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      # Emails for confirming addresses and resetting passwords (optional;
      # without them sync doesn't wait for a confirmed address). gmail: your
      # Gmail through backend/scripts/gmail-mailer.gs, with MAIL_API_KEY = the
      # script's SECRET, MAIL_FROM = "DoAll <you@gmail.com>" and
      # MAIL_SCRIPT_URL = its web app URL. See docs/operations.md.
      - key: MAIL_PROVIDER
        sync: false
      - key: MAIL_API_KEY
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: MAIL_SCRIPT_URL
        sync: false
      # Browser addresses allowed to call the API (optional): the website's,
      # comma-separated, e.g. https://doall.pages.dev,https://yourdomain.com.
      # See docs/website.md.
      - key: CORS_ORIGINS
        sync: false
      # Crash reports (optional): the Sentry project's DSN.
      - key: SENTRY_DSN
        sync: false
